<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9FDCFF">
<title>漢字すごろく</title>
<meta name="description" content="漢字の読みに答えて進む、カードでじゃましあう3Dすごろく">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/favicon-64.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="漢字すごろく">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="stage"></canvas>

  <!-- ===== はじめの画面 ===== -->
  <section class="screen active" id="screen-title">
    <div class="t-logo-area">
      <h1 class="logo big">漢字<br>すごろく</h1>
      <p class="tagline">読めたら 進める！<br>カードで じゃましあう 3Dすごろく</p>
    </div>

    <form class="setup" id="setup" autocomplete="off" onsubmit="return false">
      <div class="field">
        <span class="lbl">人数</span>
        <div class="seg" data-key="count">
          <button type="button" data-v="2">2人</button>
          <button type="button" data-v="3">3人</button>
          <button type="button" data-v="4">4人</button>
        </div>
      </div>
      <div class="player-rows" id="player-rows"></div>
      <div class="field">
        <span class="lbl">マップ</span>
        <div class="seg map-seg" data-key="map">
          <button type="button" data-v="short">みじかい<small>はるの こじま</small></button>
          <button type="button" data-v="normal">ふつう<small>なつの しま</small></button>
          <button type="button" data-v="long">ながい<small>あきの おおしま</small></button>
        </div>
      </div>
      <div class="field">
        <span class="lbl">学年</span>
        <div class="seg" data-key="grade">
          <button type="button" data-v="4">4年</button>
          <button type="button" data-v="5">5年</button>
          <button type="button" data-v="6">6年</button>
        </div>
      </div>
      <div class="field">
        <span class="lbl">こたえる時間</span>
        <div class="seg" data-key="time">
          <button type="button" data-v="20">20秒</button>
          <button type="button" data-v="30">30秒</button>
          <button type="button" data-v="0">なし</button>
        </div>
      </div>
      <div class="setup-actions">
        <button type="button" class="pill" id="btn-howto-title">あそびかた</button>
        <button type="button" class="pill online-pill" id="btn-online">オンライン</button>
        <button type="button" class="btn-roll" id="btn-start">はじめる！</button>
      </div>
    </form>
  </section>

  <!-- ===== オンライン（部屋を つくる／入る・部屋の中） ===== -->
  <section class="screen" id="screen-online">
    <div class="t-logo-area">
      <h1 class="logo big">漢字<br>すごろく</h1>
      <p class="tagline">オンラインで<br>ともだちと たいせん！</p>
    </div>

    <form class="setup" id="online-entry" autocomplete="off" onsubmit="return false">
      <h2 class="o-title">オンライン たいせん</h2>
      <div class="field">
        <span class="lbl">なまえ</span>
        <input class="o-name" id="o-name" maxlength="6" placeholder="6文字まで" spellcheck="false">
      </div>
      <p class="o-note">本名（ほんみょう）は 入れないでね。あだ名で OK！</p>
      <div class="field">
        <span class="lbl">キャラ</span>
        <div class="chars o-chars" id="o-chars"></div>
      </div>
      <div class="o-actions">
        <button type="button" class="btn-roll" id="btn-create">部屋を つくる</button>
        <div class="o-join">
          <input id="o-code" inputmode="numeric" maxlength="4" placeholder="4けたの ばんごう" autocomplete="off">
          <button type="button" class="pill" id="btn-join">入る</button>
        </div>
      </div>
      <p class="o-msg" id="o-msg"></p>
      <div class="setup-actions">
        <button type="button" class="pill" id="btn-online-back">もどる</button>
        <span class="o-test" id="o-test"></span>
      </div>
    </form>

    <form class="setup" id="online-room" autocomplete="off" onsubmit="return false" hidden>
      <div class="room-head">
        <span>部屋の ばんごう</span>
        <b class="room-code" id="room-code">----</b>
      </div>
      <p class="o-note">ともだちに この ばんごうを おしえてね（4人まで）</p>
      <div class="player-rows" id="room-members"></div>
      <div id="room-host-only">
        <button type="button" class="pill small-pill" id="btn-add-cpu">＋ CPU を 入れる</button>
        <div class="field">
          <span class="lbl">マップ</span>
          <div class="seg map-seg" id="room-map">
            <button type="button" data-v="short">みじかい<small>はるの こじま</small></button>
            <button type="button" data-v="normal">ふつう<small>なつの しま</small></button>
            <button type="button" data-v="long">ながい<small>あきの おおしま</small></button>
          </div>
        </div>
        <div class="field">
          <span class="lbl">学年</span>
          <div class="seg" id="room-grade">
            <button type="button" data-v="4">4年</button>
            <button type="button" data-v="5">5年</button>
            <button type="button" data-v="6">6年</button>
          </div>
        </div>
        <div class="field">
          <span class="lbl">こたえる時間</span>
          <div class="seg" id="room-time">
            <button type="button" data-v="20">20秒</button>
            <button type="button" data-v="30">30秒</button>
            <button type="button" data-v="0">なし</button>
          </div>
        </div>
      </div>
      <p class="o-msg" id="room-msg"></p>
      <div class="setup-actions">
        <button type="button" class="pill" id="btn-room-leave">部屋を 出る</button>
        <button type="button" class="btn-roll" id="btn-room-start">はじめる！</button>
      </div>
    </form>
  </section>

  <!-- ===== ゲーム ===== -->
  <section class="screen" id="screen-game">
    <div class="hud">
      <div class="turn-banner" id="turn-banner"></div>
      <div class="hud-right">
        <button class="pill icon" id="btn-sound" type="button" aria-label="音のオン・オフ"></button>
        <button class="pill" id="btn-view" type="button">ぜんたい</button>
        <button class="pill icon" id="btn-howto" type="button" aria-label="あそびかた">？</button>
        <button class="pill" id="btn-quit" type="button">やめる</button>
      </div>
    </div>
    <div class="dock">
      <div class="players" id="players"></div>
      <div class="actions">
        <div class="hand" id="hand"></div>
        <div class="hint" id="hint"></div>
        <button class="btn-roll" id="btn-roll" type="button" disabled>サイコロを ふる</button>
      </div>
    </div>
  </section>

  <div class="dice-pop" id="dice-pop"></div>
  <div class="floaters" id="floaters"></div>
  <div class="splash" id="splash"></div>
  <div class="toast" id="toast"></div>

  <div class="overlay" id="overlay" hidden><div class="sheet" role="dialog" aria-modal="true"></div></div>
  <div class="overlay layer2" id="overlay2" hidden><div class="sheet" role="dialog" aria-modal="true"></div></div>
  <canvas id="confetti" hidden></canvas>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
